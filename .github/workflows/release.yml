name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get version from Cargo.toml
        id: version
        run: |
          # Read `version` from [workspace.package] ONLY. A bare `grep -m1 '^version'`
          # would also match any future top-level `version = ` line above it and the
          # release tag would silently drift off the real workspace version.
          version=$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                     { in_section = 0 }
            in_section && /^version[[:space:]]*=/ {
              sub(/^version[[:space:]]*=[[:space:]]*/, "")
              gsub(/["[:space:]]/, "")
              print; exit
            }' Cargo.toml)

          # Releases are named v<X>.<Y>.<Z> — refuse to tag anything else.
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::[workspace.package] version is '${version}', expected X.Y.Z"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release tag will be v${version}"
      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Incremental release (skip if already exists)
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "$PREV_TAG..HEAD" --oneline --no-merges)
          else
            NOTES=$(git log --oneline --no-merges)
          fi
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "$NOTES"
