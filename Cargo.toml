[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "2.2.1"
edition = "2021"
# Dependencies in Cargo.lock (clap, getrandom, ...) use edition 2024, so 1.85 is the
# real floor. Declared here so cargo fails fast instead of surfacing a confusing
# error from a transitive dependency.
rust-version = "1.85"
license = "Apache-2.0"
homepage = "https://package.erik.xyz/canal"
repository = "https://github.com/erikwang2013/canal-rust"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
prost = "0.13"
prost-types = "0.13"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
serde_json = "1"
futures = "0.3"
rdkafka = { version = "0.36", features = ["tokio"] }
axum = "0.7"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
dashmap = "5"
rustc-hash = "1"

# Internal crates: path for local builds, version is required by `cargo publish`.
canal-admin = { path = "crates/canal-admin", version = "2.2.1" }
canal-binlog = { path = "crates/canal-binlog", version = "2.2.1" }
canal-client = { path = "crates/canal-client", version = "2.2.1" }
canal-common = { path = "crates/canal-common", version = "2.2.1" }
canal-connector = { path = "crates/canal-connector", version = "2.2.1" }
canal-filter = { path = "crates/canal-filter", version = "2.2.1" }
canal-instance = { path = "crates/canal-instance", version = "2.2.1" }
canal-meta = { path = "crates/canal-meta", version = "2.2.1" }
canal-prometheus = { path = "crates/canal-prometheus", version = "2.2.1" }
canal-proto = { path = "crates/canal-proto", version = "2.2.1" }
canal-server = { path = "crates/canal-server", version = "2.2.1" }
canal-sink = { path = "crates/canal-sink", version = "2.2.1" }
canal-store = { path = "crates/canal-store", version = "2.2.1" }
